name: Build IPA
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v3

      - name: Build for iOS
        run: |
          xcodebuild \
            -scheme "YT for TV" \
            -configuration Release \
            -destination generic/platform=iOS \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Create IPA
        run: |
          echo "Searching for .app in .build:"
          find .build -name "*.app" -type d
          
          # Try the exact path
          APP=".build/Build/Products/Release-iphoneos/YT for TV.app"
          if [ -d "$APP" ]; then
            echo "Found at exact path: $APP"
          else
            echo "Not at exact path, searching..."
            APP=$(find .build -name "*.app" -type d | head -1)
            if [ -z "$APP" ]; then
              echo "ERROR: No .app found anywhere in .build"
              find .build -type f -name "Info.plist" | head -5
              exit 1
            fi
            echo "Found at: $APP"
          fi
          
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r "YT for TV.ipa" Payload
          ls -lh "YT for TV.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: YT for TV IPA
          path: "YT for TV.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: YT for TV IPA
          path: "YT for TV.ipa"
