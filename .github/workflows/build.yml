name: Build IPA
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v3

      - name: Build for iOS
        run: |
          xcodebuild \
            -scheme "YT for TV" \
            -configuration Release \
            -destination generic/platform=iOS \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Create IPA
        run: |
          APP=$(find .build -path "*/Release-iphoneos/*.app" | head -1)
          if [ -z "$APP" ]; then
            echo "App not found, listing .build:"
            find .build -type d -name "*.app"
            exit 1
          fi
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r "YT for TV.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: YT for TV IPA
          path: "YT for TV.ipa"
