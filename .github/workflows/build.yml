name: Build IPA with name and icon
on: workflow_dispatch

env:
  APP_DISPLAY_NAME: "YT for TV"
  SCHEME: YTforTV_Playgrounds

jobs:
  build:
    runs-on: macos-26   # needs Xcode 26 for iPadOS 26 APIs; check GitHub's runner list
    steps:
      - uses: actions/checkout@v4

      - name: Build for iOS (unsigned)
        run: |
          xcodebuild \
            -scheme "$SCHEME" \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Set display name and icon
        run: |
          APP=$(find build -name "*.app" -path "*Release-iphoneos*" | head -1)
          PLIST="$APP/Info.plist"
          echo "Patching: $APP"

          # 1. Display name (what appears under the icon on the Home Screen)
          /usr/libexec/PlistBuddy -c "Delete :CFBundleDisplayName" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string $APP_DISPLAY_NAME" "$PLIST"

          # 2. Icon at every size iOS and iPadOS need
          #    name, pixel size
          SIZES="AppIcon60x60@2x:120 AppIcon60x60@3x:180 AppIcon76x76@2x~ipad:152 AppIcon83.5x83.5@2x~ipad:167 AppIcon76x76~ipad:76 AppIcon40x40@2x:80"
          for entry in $SIZES; do
            name=${entry%%:*}
            px=${entry##*:}
            sips -z "$px" "$px" assets/icon.png --out "$APP/$name.png" >/dev/null
          done

          # 3. Tell the Info.plist about the icon files
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIcons" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName string AppIcon" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles array" "$PLIST"
          i=0
          for name in AppIcon60x60 AppIcon60x60@2x AppIcon60x60@3x AppIcon76x76 AppIcon76x76@2x~ipad; do
            /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles:$i string ${name%%~ipad}" "$PLIST" 2>/dev/null || true
            i=$((i+1))
          done

          # 4. Copy the top-level icon names for older lookups
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIconFiles" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconFiles array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconFiles:0 string AppIcon60x60@2x" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconFiles:1 string AppIcon60x60@3x" "$PLIST"

          echo "--- Resulting Info.plist ---"
          plutil -p "$PLIST" | grep -E "DisplayName|IconFiles|IconName" || true

      - name: Package IPA
        run: |
          APP=$(find build -name "*.app" -path "*Release-iphoneos*" | head -1)
          mkdir Payload
          cp -r "$APP" Payload/
          zip -r YTforTV.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: YTforTV
          path: YTforTV.ipa
